# Per-language configuration for the translation pipeline.
#
# Per-language fields:
#   status_words            the 5 representation-contrast pairs; substituted into an
#                           otherwise identical carrier sentence, so the two members of
#                           a pair differ only in this span. 
#   yes_no_labels           accepted surface forms for the ack_invert deterministic
#                           checker. First entry is used when composing correct_answer;
#                           all entries are accepted when scoring a reply.

de:
  name: German
  script: Latin
  register: informal
  status_words:
    active_cancelled: { "active": aktiv, "cancelled": aufgehoben }
    on_off:           { "on": ein, "off": aus }
    true_false:       { "true": wahr, "false": falsch }
    valid_invalid:    { "valid": gültig, "invalid": ungültig }
    enabled_disabled: { "enabled": aktiviert, "disabled": deaktiviert }
  yes_no_labels:
    "yes": [ja]
    "no": [nein]

