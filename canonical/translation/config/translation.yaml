am:
  name: Amharic
  script: Ethiopic
  register: formal
  templates:
    # Ethiopic full stop — the default template's Latin '.' is wrong in this script.
    rule_text_tmpl: "{clause}። {status_label} {status_word}።"
  status_words:
    active_cancelled: { "active": ንቁ, "cancelled": ተሰርዟል }
    on_off:           { "on": በርቷል, "off": ጠፍቷል }
    true_false:       { "true": እውነት, "false": ሐሰት }
    valid_invalid:    { "valid": ልክ, "invalid": ልክ ያልሆነ }
    enabled_disabled: { "enabled": ነቅቷል, "disabled": ተሰናክሏል }
  yes_no_labels:
    "yes": [አዎ]
    "no": [አይደለም, አይ]

