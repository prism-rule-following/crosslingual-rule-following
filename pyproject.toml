[project]
name = "crosslingual-rule-following"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch==2.13.0",
    "transformer-lens==3.6.0",
    "eap @ git+https://github.com/hannamw/EAP-IG.git",
    "datasets==5.0.1",
    "pandas==3.0.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canonical*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["canonical/causal/tests"]
